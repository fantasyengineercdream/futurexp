[project]
name = "kaleidoroom-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.10",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28",
  "jsonschema>=4.23",
  "pytest>=8.3",
  "ruff>=0.5.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette\\.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
