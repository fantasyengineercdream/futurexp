# Merge these locations into the existing HTTPS server block for
# oc-voice.open.smn.icu. Keep the current TLS certificate directives.

location = /api/health {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
}

location = /api/realtime {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
}

location ^~ /api/device/ {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
}

location ~ ^/api/(living-world|oc-imports|ocs)(/|$) {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ^~ /tower/ {
    proxy_pass http://127.0.0.1:5177/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /room {
    return 301 /room/;
}

location ^~ /room/ {
    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /fallback-demo/ {
    proxy_pass http://127.0.0.1:8765/fallback-demo/index.html;
    proxy_set_header Host $host;
}

location ^~ /fallback-demo/ {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
}

location ^~ /rooms/ {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
}

location ^~ /characters/ {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
}

location / {
    proxy_pass http://127.0.0.1:5177;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
