[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "oc-hardware-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4"]

[project.optional-dependencies]
zilo = ["bleak>=0.22,<1"]
test = [
  "jsonschema>=4.23,<5",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
oc-gateway = "oc_gateway.__main__:main"
oc-display = "oc_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
