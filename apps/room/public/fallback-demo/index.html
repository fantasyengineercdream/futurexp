<!doctype html>
<html lang="zh-CN" data-no-llm="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OOCC · 无模型降级演示</title>
    <style>
      :root { color-scheme: dark; font-family: "Noto Sans SC", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: #f7f2e8; background: #09090b; overflow-x: hidden; }
      body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .18;
        background: repeating-linear-gradient(0deg, transparent 0 3px, #fff 4px); mix-blend-mode: overlay; }
      main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 48px; }
      header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 24px; }
      h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(30px, 5vw, 58px); font-weight: 500; }
      .badge { padding: 8px 12px; border: 1px solid #ffb74d; color: #ffcf87; font: 700 12px/1 monospace; letter-spacing: .12em; }
      .notice { margin: 0 0 24px; color: #aaa39a; max-width: 760px; line-height: 1.7; }
      .stage { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; }
      .computer, .passport { border: 1px solid #48433d; background: rgba(19,18,18,.94); box-shadow: 0 24px 80px #000; }
      .computer { min-height: 520px; padding: 24px; position: relative; overflow: hidden; }
      .computer::after { content: "COMPUTER / PUBLIC VOICE"; position: absolute; top: 12px; right: 14px; color: #777; font: 11px monospace; }
      .portrait { width: 180px; aspect-ratio: 1; object-fit: contain; display: block; margin: 26px auto 12px; image-rendering: pixelated; }
      .name { text-align: center; font: 600 14px monospace; letter-spacing: .12em; color: #d8c9b5; }
      .dialogue { margin: 20px auto; max-width: 650px; min-height: 116px; padding: 18px 20px; border: 1px solid #615b53; background: #0c0c0e; }
      .speaker { color: #ffcf87; font: 700 12px monospace; margin-bottom: 10px; }
      .reply { font-size: clamp(18px, 2.5vw, 27px); line-height: 1.55; }
      form { display: grid; grid-template-columns: 130px 1fr auto; gap: 10px; margin-top: 24px; }
      select, input, button { min-height: 46px; border: 1px solid #5a554e; background: #0c0c0e; color: #f7f2e8; padding: 0 13px; font: inherit; }
      button { cursor: pointer; background: #e9d6b3; color: #15120f; font-weight: 800; }
      button:hover { background: #ffe2a6; }
      .passport { align-self: center; padding: 16px; color: #171717; background: #ddd8c8; transform: rotate(1.2deg); }
      .passport-screen { min-height: 330px; padding: 20px 16px; border: 5px solid #202020; background: #f3f0df; display: flex; flex-direction: column; justify-content: space-between; }
      .passport-title { font: 800 12px monospace; letter-spacing: .12em; }
      .os-face { width: 120px; height: 120px; margin: 12px auto; object-fit: contain; filter: grayscale(1) contrast(1.3); image-rendering: pixelated; }
      .os-label { font: 700 11px monospace; border-bottom: 2px solid; padding-bottom: 5px; }
      .inner-os { font: 800 23px/1.4 serif; min-height: 68px; margin-top: 10px; }
      .local { font: 10px monospace; opacity: .65; }
      footer { margin-top: 18px; display: flex; gap: 18px; flex-wrap: wrap; color: #8e877d; font: 12px monospace; }
      @media (max-width: 760px) { .stage { grid-template-columns: 1fr; } .passport { width: min(330px, 100%); justify-self: center; } form { grid-template-columns: 1fr; } header { align-items: start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>OC Room · 降级模式</h1>
        <span class="badge">LOCAL FALLBACK · NO LLM</span>
      </header>
      <p class="notice">仅在实时模型不可用时启用。输入仍由用户决定；回应来自本地、可审计的角色规则，不调用 LLM、不请求网络，也不写入 Living World Canon。</p>
      <section class="stage">
        <div class="computer">
          <img class="portrait" id="portrait" alt="当前 OC" />
          <div class="name" id="name"></div>
          <div class="dialogue" aria-live="polite">
            <div class="speaker" id="speaker"></div>
            <div class="reply" id="publicReply"></div>
          </div>
          <form id="fallbackForm">
            <select id="character" aria-label="选择角色">
              <option value="angel">OO · 小天使</option>
              <option value="devil">CC · 小恶魔</option>
            </select>
            <input id="userText" maxlength="120" value="我今天压力很大，但又不知道该怎么办。" aria-label="对 OC 说的话" />
            <button type="submit">发送给 TA</button>
          </form>
        </div>
        <aside class="passport" aria-label="OC 签证内心 OS">
          <div class="passport-screen">
            <div>
              <div class="passport-title">OOCC / OC PASSPORT</div>
              <img class="os-face" id="osFace" alt="OC 签证角色图" />
            </div>
            <div>
              <div class="os-label">没说出口的内心 OS</div>
              <div class="inner-os" id="innerOs" aria-live="polite"></div>
              <div class="local">SOURCE: DETERMINISTIC FALLBACK</div>
            </div>
          </div>
        </aside>
      </section>
      <footer><span>✓ 无网络</span><span>✓ 无模型 Key</span><span>✓ 不泄露思维链</span><span>✓ 不修改世界事实</span></footer>
    </main>
    <script>
      const characters = {
        angel: {
          name: "OO · 小天使女仆",
          image: "/characters/angel-maid-pixel-v2.webp",
          responses: {
            emotion: ["先别逼自己马上振作。坐一会儿，把最难受的那件事告诉我。", "……我会留在这里，等你把这口气喘匀。"],
            advice: ["先只选一件最小、最确定的事。做完以后，我们再决定下一步。", "我可不是在哄你，我只是不准你一个人硬扛。"],
            default: ["我听见了。我们先把这句话放在这里，不急着给它一个漂亮答案。", "其实我很在意你会怎么选。"]
          }
        },
        devil: {
          name: "CC · 小恶魔女仆",
          image: "/characters/devil-maid-pixel-v2.webp",
          responses: {
            emotion: ["把今天最糟的部分交出来，我先替你保管。代价嘛——今晚好好休息。", "才不是担心你，我只是讨厌你难过。"],
            advice: ["先签一份最小契约：十分钟，只做一件事。十分钟后你随时可以反悔。", "要是你真放弃了，我会有一点点寂寞。"],
            default: ["说吧，主人。我允许你暂时不坚强，也允许你还没想明白。", "我其实已经等你很久了。"]
          }
        }
      };
      const byId = (id) => document.getElementById(id);
      function category(text) {
        if (/(累|难受|压力|痛苦|焦虑|害怕|孤独)/.test(text)) return "emotion";
        if (/(怎么办|建议|选择|决定|下一步)/.test(text)) return "advice";
        return "default";
      }
      function render() {
        const character = characters[byId("character").value];
        const [spoken, privateOs] = character.responses[category(byId("userText").value)];
        byId("name").textContent = character.name;
        byId("speaker").textContent = `${character.name} · 说出口的话`;
        byId("publicReply").textContent = spoken;
        byId("innerOs").textContent = privateOs;
        byId("portrait").src = character.image;
        byId("osFace").src = character.image;
        if ("speechSynthesis" in window) {
          speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(spoken);
          utterance.lang = "zh-CN";
          speechSynthesis.speak(utterance);
        }
      }
      byId("fallbackForm").addEventListener("submit", (event) => { event.preventDefault(); render(); });
      byId("character").addEventListener("change", render);
      render();
    </script>
  </body>
</html>
